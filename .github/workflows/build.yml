name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test --configuration Release

      # Номер версии = номер запуска CI; по нему программа находит обновления (релиз v2.0.N).
      - name: Publish win-x64
        run: dotnet publish src/ConverterReport.Gui -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=2.0.${{ github.run_number }} -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ConverterReport-win-x64
          path: |
            publish/ConverterReport.exe
            publish/ConverterReport.sample.json
            publish/Справочно.sample.txt

      # Сборка из main публикуется как релиз — exe можно скачать без входа в GitHub.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          $tag = "v2.0.${{ github.run_number }}"
          Compress-Archive -Path publish/ConverterReport.exe, publish/ConverterReport.sample.json, "publish/Справочно.sample.txt" -DestinationPath ConverterReport-win-x64.zip
          $subject = git log -1 --pretty=%s
          @(
            $subject
            ""
            "Первая установка: распакуйте архив в отдельную папку и запустите ConverterReport.exe — этапы, пути к экранам и все параметры задаются в окне программы."
            "Дальше программа обновляется сама: при запуске проверяет новые версии (Справка → Проверить обновления)."
          ) | Set-Content -Path notes.md -Encoding utf8
          gh release create $tag ConverterReport-win-x64.zip --target $env:GITHUB_SHA --title "ConverterReport $tag" --notes-file notes.md
